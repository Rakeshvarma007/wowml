name: WowML CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapacke-dev pkg-config

      - name: Install OpenBLAS (macOS)
        if: runner.os == 'macos' || runner.os == 'macOS'
        run: |
          brew install openblas lapack
          echo "OPENBLAS_HOME=$(brew --prefix openblas)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openblas)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Install OpenBLAS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile openblas.zip
          Expand-Archive -Path openblas.zip -DestinationPath C:\openblas -Force
          Remove-Item openblas.zip
          $blasDir = Get-ChildItem C:\openblas -Directory | Select-Object -First 1
          $root = if ($blasDir -and (Test-Path "$($blasDir.FullName)\bin")) { $blasDir.FullName } else { "C:\openblas" }
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "OPENBLAS_HOME=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build C Kernel & Tests
        run: |
          cmake --build build --config Release

      - name: Run C Tests (ctest)
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Install Python Package in Dev Mode
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python Tests (pytest)
        run: |
          pytest tests/ -v