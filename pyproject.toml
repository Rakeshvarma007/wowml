[build-system]
requires = ["setuptools>=68.0", "wheel", "cmake>=3.20"]
build-backend = "setuptools.build_meta"

[project]
name = "wowml"
version = "0.1.0"
description = "Python ML library with a C kernel, linear algebra, and autograd"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "numpy"]

[tool.setuptools.packages.find]
include = ["wowml*"]
